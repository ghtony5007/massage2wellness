<!DOCTYPE html>

<head>

    <title>Page Not Found — Massage2Wellness</title>
    <link rel="stylesheet" href="styles/main.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@300;400;600&family=Open+Sans:wght@300;400;500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

<body>
    <div id="nav-placeholder"></div>

    <section class="not-found-section">
        <div class="not-found-content">
            <div class="not-found-icon">
                <i class="fas fa-spa"></i>
            </div>
            <h1>Page Not Found</h1>
            <p>This page seems to have wandered off for a massage.<br>Let's get you back on track.</p>
            <div class="not-found-actions">
                <a href="index.html" class="btn btn-primary">Return Home</a>
                <a href="booking.html" class="btn btn-secondary">Book Appointment</a>

        </div>
    </section>

    <div id="footer-placeholder"></div>

    <script src="scripts/components.js"></script>
    <script src="scripts/main.js"></script>

    <style>
        .not-found-section {
            min-height: 80vh;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 4rem 1rem;
        }
        .not-found-content { max-width: 480px; }
        .not-found-icon {
            font-size: 5rem;
            color: var(--secondary-color);
            margin-bottom: 1.5rem;
            opacity: 0.7;
        }
        .not-found-content h1 {
            font-size: clamp(2rem, 5vw, 3.5rem);
            color: var(--text-dark);
            margin-bottom: 1rem;
            letter-spacing: -0.02em;
        }
        .not-found-content p {
            font-size: 1.1rem;
            color: var(--text-light);
            line-height: 1.7;
            margin-bottom: 2.5rem;
        }
        .not-found-actions {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }
    </style>

</html>
